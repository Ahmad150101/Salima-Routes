<!doctype html><html><head><meta charset="utf-8"><title>Routing tests</title></head><body><pre id="out"></pre><script src="js/routing.js"></script><script>
const out = document.getElementById('out');
function assert(name, cond){ out.textContent += `${cond?'PASS':'FAIL'} - ${name}\n`; if(!cond) throw new Error(name); }
const pts=[{lat:32.31,lng:35.03},{lat:32.32,lng:35.04},{lat:32.30,lng:35.02}];
assert('haversine positive', SalimaRouting.haversineMeters(pts[0],pts[1])>0);
const m=SalimaRouting.fallbackMatrix(pts);
assert('matrix size',m.distances.length===3 && m.durations.length===3);
const order=SalimaRouting.optimizeOrder(m.distances,m.durations,'distance',9.5,true);
assert('route starts depot',order[0]===0);
assert('route returns depot',order[order.length-1]===0);
assert('visits every customer',new Set(order.slice(0,-1)).size===3);
const metrics=SalimaRouting.routeMetrics(order,m.distances,m.durations,9.5);
assert('metrics positive',metrics.distance>0&&metrics.duration>0&&metrics.fuel>0);
assert('fuel estimation positive',SalimaRouting.estimateFuelLiters(10000,1200,10)>0);
out.textContent += '\nAll routing core tests passed.\n';
</script></body></html>
