<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>اختبار خوارزميات Salima Routes</title><body><pre id="output">جاري الاختبار…</pre><script type="module">import{fallbackMatrix,buildAlternatives}from'./js/routing/local-optimizer.js';import{estimateFuelLiters}from'./js/utils/geo.js';const p=[{latitude:32.3,longitude:35},{latitude:32.31,longitude:35.01},{latitude:32.32,longitude:35.02}],r=buildAlternatives(fallbackMatrix(p),10,true),checks=[['ثلاثة مسارات',r.length===3],['زيارة النقاط',r.every(x=>new Set(x.order.slice(1,-1)).size===2)],['معادلة الوقود',estimateFuelLiters(100000,10)===10]];document.querySelector('#output').textContent=checks.map(([n,v])=>`${v?'PASS':'FAIL'}: ${n}`).join('\n');</script></body></html>
